<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Hungry Hole</title>
<style>
/* ===================== STYLES ===================== */
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Trebuchet MS","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0b0820;color:#fff}
#gl,#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#gl{background:#000}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
.btn{background:linear-gradient(#ffcf4a,#f59e0b);color:#3a1d00;font-weight:800;border-radius:18px;box-shadow:0 6px 0 #a35c00,0 10px 18px rgba(0,0,0,.4);font-size:26px;padding:14px 28px;letter-spacing:1px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35c00}
.btn.blue{background:linear-gradient(#6ad1ff,#2b8fe0);color:#06213b;box-shadow:0 6px 0 #165a96,0 10px 18px rgba(0,0,0,.4)}
.btn.pink{background:linear-gradient(#ff9ad5,#e0459b);color:#3b0626;box-shadow:0 6px 0 #92245f,0 10px 18px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#8ef08e,#2eb84a);color:#06300f;box-shadow:0 6px 0 #18752c,0 10px 18px rgba(0,0,0,.4)}
.btn.grey{background:linear-gradient(#e6e6f0,#a9a9c0);color:#20203a;box-shadow:0 6px 0 #6b6b85,0 10px 18px rgba(0,0,0,.4)}
.btn.red{background:linear-gradient(#ff8f8f,#e03b3b);color:#3b0606;box-shadow:0 6px 0 #922424,0 10px 18px rgba(0,0,0,.4)}
.btn.sm{font-size:18px;padding:9px 16px;border-radius:13px}
.btn[disabled]{filter:grayscale(1) brightness(.7);pointer-events:none}
.ico{width:1em;height:1em;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round{width:64px;height:64px;border-radius:50%;background:rgba(20,16,50,.75);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;padding:0}
.round:active{transform:scale(.92)}
.title{font-size:84px;font-weight:900;letter-spacing:4px;text-align:center;color:#fff;text-shadow:0 6px 0 #5b2bb5,0 10px 30px #000}
.h2{font-size:42px;font-weight:900;text-align:center;margin:18px 0 8px;text-shadow:0 4px 0 #5b2bb5}
.panel{background:rgba(25,18,60,.92);border:3px solid rgba(255,255,255,.25);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.top-back{position:absolute;left:18px;top:18px}
.cards{position:absolute;left:40px;right:40px;top:100px;bottom:20px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:flex-start;overflow-y:auto}
.ccard{width:280px;height:276px;border-radius:20px;padding:12px 14px;box-sizing:border-box;position:relative;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:left}
.ccard.locked{filter:grayscale(.9) brightness(.55)}
.ccard .num{font-size:15px;font-weight:800;opacity:.85;letter-spacing:2px}
.ccard .nm{font-size:25px;font-weight:900;line-height:1.05;margin:2px 0 8px;min-height:52px}
.ccard .row{font-size:16px;margin:3px 0;display:flex;justify-content:space-between}
.ccard .acts{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}
.ccard .acts .btn{flex:1;font-size:17px;padding:8px 6px}
.ccard .lock{position:absolute;right:14px;top:12px;font-size:28px}
.tabs{position:absolute;left:110px;right:20px;top:20px;display:flex;gap:8px;flex-wrap:wrap}
.tab{font-size:17px;font-weight:800;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff}
.tab.sel{background:#ffcf4a;color:#3a1d00}
.tab[disabled]{opacity:.35;pointer-events:none}
.ugrid{position:absolute;left:24px;top:96px;width:770px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ucard{height:200px;border-radius:18px;background:rgba(40,30,90,.95);border:3px solid rgba(255,255,255,.18);color:#fff;padding:10px 6px;box-sizing:border-box;text-align:center;position:relative}
.ucard.sel{border-color:#ffcf4a;box-shadow:0 0 0 3px #ffcf4a55}
.ucard .un{font-size:16px;font-weight:800;min-height:38px;line-height:1.15}
.pips{display:flex;gap:3px;justify-content:center;margin:6px 0}
.pip{width:10px;height:14px;border-radius:3px;background:rgba(255,255,255,.18)}
.pip.on{background:#ffcf4a}
.ucard .cost{font-size:15px;font-weight:800;color:#ffd96a}
.udetail{position:absolute;left:812px;top:96px;width:444px;height:420px;padding:20px;box-sizing:border-box}
.udetail h3{margin:0 0 6px;font-size:30px}
.udetail p{font-size:18px;line-height:1.35;margin:6px 0}
.wallet{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:24px;color:#ffd96a}
.holdpop{position:absolute;z-index:30;width:300px;padding:16px;font-size:19px;line-height:1.35;pointer-events:none;display:none;background:#fff8dc;color:#2a1a00;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.6);border:3px solid #ffcf4a}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
.modal.on{display:flex}
.mbox{padding:24px 28px;min-width:420px;max-width:900px;text-align:center}
.mbox .btn{margin:8px}
.set-grid{position:absolute;left:40px;right:40px;top:96px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-col{padding:18px 20px;box-sizing:border-box;overflow-y:auto}
.set-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px;font-size:21px;font-weight:700;gap:10px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.seg button{font-size:17px;font-weight:800;padding:8px 13px;background:transparent;color:#fff}
.seg button.sel{background:#ffcf4a;color:#3a1d00}
textarea{width:100%;box-sizing:border-box;height:84px;font-size:13px;border-radius:10px;border:2px solid #777;background:#110d2b;color:#cfe;padding:6px;font-family:monospace;user-select:text;-webkit-user-select:text}
.scr.solid{background:#1b1440}
.qboard{position:absolute;left:24px;right:24px;top:84px;bottom:10px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:min-content;gap:5px;align-content:start}
.qitem{border-radius:9px;padding:3px 7px;font-size:12.5px;line-height:1.15;background:#2c2462;display:flex;gap:6px;align-items:center;min-height:40px;box-sizing:border-box}
.qitem.done{background:#25603e}
.qitem .tk{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:13px}
.qboard .pp{grid-column:1/-1;display:block;min-height:0;padding:6px 8px;font-size:12.5px}
#b-quest-hud,#b-up-hud{display:none}
#hudbtns.mode #b-quest-hud{display:flex}
#hudbtns.on #b-up-hud{display:flex}
#b-up-hud{width:auto;height:56px;padding:0 22px;border-radius:28px;background:#ff8c1a;border:3px solid #fff;color:#fff;font:900 20px/1 system-ui,sans-serif;letter-spacing:1px;box-shadow:0 4px 0 #b85a00,0 6px 14px rgba(0,0,0,.35)}
#b-up-hud:active{transform:translateY(2px);box-shadow:0 2px 0 #b85a00}
.ucard img.uic{width:72px;height:72px;display:block;margin:0 auto 4px}
.tgts{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.qitem.done .tk{background:#2eb84a;border-color:#2eb84a}
#hudbtns{position:absolute;right:16px;bottom:16px;display:none;gap:12px;z-index:5}
#hudbtns.on{display:flex}
.report{font-size:20px;line-height:1.7}
.bar{height:16px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:#6ad1ff}
.credits{position:absolute;inset:0;overflow:hidden;text-align:center}
.credits .roll{position:absolute;left:0;right:0;top:720px;font-size:30px;line-height:1.7}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes flycoin{0%{transform:translate(0,0);opacity:1}100%{transform:translate(260px,-10px);opacity:0}}
.banker{animation:bob 1.2s ease-in-out infinite;transform-origin:50% 90%}
.flycoin{animation:flycoin .8s ease-in forwards}
#s-main .strip{position:absolute;left:0;right:0;bottom:0;height:112px;background:#fff6d8;border-top:4px solid #f0d488;box-sizing:border-box;padding:14px 96px 16px 16px;display:flex;gap:14px}
.mbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:20px;font-weight:900;font-size:30px;letter-spacing:1px;color:#3a1d00;background:linear-gradient(#ffcf4a,#f59e0b);box-shadow:0 6px 0 #a35c00,0 8px 14px rgba(80,50,0,.25)}
.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35c00}
.mbtn.blue{background:linear-gradient(#6ad1ff,#2b8fe0);color:#06213b;box-shadow:0 6px 0 #165a96,0 8px 14px rgba(0,40,80,.25)}
.mbtn.green{background:linear-gradient(#8ef08e,#2eb84a);color:#06300f;box-shadow:0 6px 0 #18752c,0 8px 14px rgba(0,60,20,.25)}
.mbtn.pink{background:linear-gradient(#ff9ad5,#e0459b);color:#3b0626;box-shadow:0 6px 0 #92245f,0 8px 14px rgba(80,0,40,.25)}
.mbtn .mi{font-size:38px;display:flex}
#b-settings{position:absolute;right:18px;bottom:26px;width:58px;height:58px;font-size:28px;background:#c9b77a;border-color:#fff}
#main-sub{position:absolute;left:0;right:0;bottom:122px;text-align:center;font-size:19px;font-weight:800;color:#fff;text-shadow:0 2px 4px #000}
#sizebtns{position:absolute;right:20px;top:250px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:5;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 3px #000}
#sizebtns.on{display:flex}
#sizebtns .round{font-size:40px;font-weight:900;background:rgba(224,69,155,.85)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="cv" width="1280" height="720"></canvas>

  <!-- MAIN SCREEN: a living Vancouver title scene (drawn on the canvas) over a cream strip of four modes -->
  <div class="scr" id="s-main">
    <div id="main-sub"></div>
    <div class="strip">
      <button class="mbtn" id="b-start"><span class="mi" id="mi-story"></span>STORY</button>
      <button class="mbtn blue" id="b-ispy"><span class="mi" id="mi-ispy"></span>I SPY</button>
      <button class="mbtn green" id="b-edu"><span class="mi" id="mi-edu"></span>EDUCATIONAL</button>
      <button class="mbtn pink" id="b-explore"><span class="mi" id="mi-explore"></span>EXPLORATION</button>
    </div>
    <button class="round" id="b-settings" aria-label="Settings"></button>
  </div>

  <!-- CHAPTERS (story) / chapter picker for I SPY + EDUCATIONAL -->
  <div class="scr" id="s-chapters">
    <button class="round top-back" data-back aria-label="Back"></button>
    <div class="h2" id="chap-title">WORLDS</div>
    <div class="cards" id="chap-cards"></div>
  </div>

  <!-- QUEST BOARD -->
  <div class="scr solid" id="s-board">
    <button class="round top-back" id="board-back" aria-label="Back"></button>
    <div class="h2" id="board-title">QUEST BOARD</div>
    <div class="qboard" id="board-list"></div>
  </div>

  <!-- UPGRADES -->
  <div class="scr" id="s-upgrades">
    <button class="round top-back" data-back aria-label="Back"></button>
    <div class="tabs" id="up-tabs"></div>
    <div class="ugrid" id="up-grid"></div>
    <div class="udetail panel" id="up-detail"></div>
    <div style="position:absolute;left:812px;top:530px;width:444px;display:flex;align-items:center;justify-content:space-between">
      <span class="wallet" id="up-wallet"></span>
      <button class="btn" id="b-banker">BANKER</button>
    </div>
    <div style="position:absolute;left:24px;top:540px;width:770px;font-size:17px;opacity:.8;line-height:1.4">Tap a card to pick it. Press and hold a card to read about it. Upgrades only help the world they were bought in.</div>
    <div class="holdpop" id="holdpop"></div>
  </div>

  <!-- SETTINGS -->
  <div class="scr" id="s-settings">
    <button class="round top-back" data-back aria-label="Back"></button>
    <div class="h2">SETTINGS</div>
    <div class="set-grid">
      <div class="set-col panel" id="set-left"></div>
      <div class="set-col panel" id="set-right"></div>
    </div>
  </div>

  <!-- CREDITS -->
  <div class="scr" id="s-credits"><div class="credits"><div class="roll" id="credits-roll"></div></div></div>

  <div id="hudbtns">
    <button class="round" id="b-quest-hud" aria-label="Quests"></button>
    <button class="round" id="b-up-hud">UPGRADES</button>
    <button class="round" id="b-sound-hud" aria-label="Sound"></button>
    <button class="round" id="b-pause" aria-label="Pause"></button>
  </div>

  <div id="sizebtns"><button class="round" id="b-bigger" aria-label="Bigger">+</button><div>SIZE</div><button class="round" id="b-smaller" aria-label="Smaller">&minus;</button></div>

  <div class="modal" id="modal"><div class="mbox panel" id="mbox"></div></div>
</div>
<script src="three.min.js"></script>
<script src="data/ch3-osm.js"></script>
<script src="audio/manifest.js"></script>
<script>
'use strict';
/* =====================================================================
   HUNGRY HOLE — single-file game. Sections, in order:
     1. DATA: common tables (tiers, upgrades, icons)
     2. DATA: the 7 chapters (types, zones, authored places, checklists,
        40 Tiny Quests each)
     3. ENGINE: save, audio, world (grid + procedural layers),
        hole, eating, quests, economy
     4. RENDER: backgrounds, objects, hole, HUD
     5. UI: menu screens (DOM), modals
     6. MAIN: input, loop, boot, test hook (window.HH)
   ===================================================================== */

/* ===================== 1. DATA: COMMON ===================== */
const SAVE_KEY = 'hungry-hole-data-v1';      // never rename; fields are additive only
const STAGE_W = 1280, STAGE_H = 720;
const FALL_MS = 340;                          // tip over the rim, sink, spin + shrink; then the eat pipeline runs
const WOBBLE_MIN = 0.85, WOBBLE_STEP = 0.36;  // owner's wobble rule: from 85% of the needed size, bumps can tip a leaning thing in
const NEED_K = 0.2, XP_K = 1.8, SPEED = 4.32, START_P = 0.3;   // growth need per level (x chapter need), XP per eat, speed in hole-widths/s, pre-grown start
const FILL_K = 0.3;                           // v4 density cut: loose filler scatter at ~30% of v3 (placed/authored things carry the world)
const PTS = [0, 5, 8, 12, 16, 22, 30, 40, 52, 66, 82, 100, 120, 145, 170, 200]; // points by tier (x chapter cost scale)
const MULT = [1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0]; // points ladder (x2.0 only at lvl 10)
const GROW = l => 1 + 0.15 * l;               // v4: Growth Boost x1.0 -> x2.5 (upgrades must be unmistakable)
const COMBO_MS = 6000;
const UP_BASE = 40, UP_GROW = 1.38;           // upgrade cost = base * grow^(n-1) * chapter multiplier (v4: flatter, runs are longer)
const RESPAWN_MS = 45000;                     // eaten ordinary things come back after this, out of sight
const TINY_BONUS = 20, CHECK_BONUS = 100;     // quest coin bonuses (x chapter coin scale)
const ISPY_BONUS = 150, EDU_BONUS = 60;       // mode rewards (x chapter coin scale), paid into that chapter's wallet

const UPGRADES = [
  {k:'speed',  n:'Speed',        d:'Your hole zooms around faster.',                         fx:l=>l?`+${l*10}% speed`:'normal speed'},
  {k:'growth', n:'Growth Boost', d:'Every bite makes you grow more.',                        fx:l=>`x${GROW(l).toFixed(2).replace(/0$/, '')} growth`},
  {k:'points', n:'Points Boost', d:'Every bite is worth more points.',                       fx:l=>`x${MULT[l].toFixed(1)} points`},
  {k:'coin',   n:'Coin Boost',   d:'You earn more coins from everything.',                   fx:l=>l?`+${l*12}% coins`:'normal coins'},
  {k:'magnet', n:'Magnet Aura',  d:'Things you can eat slide toward you by themselves.',     fx:l=>l?`pulls from ${(1+l*0.25).toFixed(2).replace(/0$/, '')}x your size`:'no pull yet'},
  {k:'vacuum', n:'Vacuum Reach', d:'Things fall in from further away.',                      fx:l=>l?`+${l*10}% reach`:'normal reach'},
  {k:'lucky',  n:'Lucky Coins',  d:'Sometimes a bite drops a bonus coin too.',               fx:l=>l?`${l*4}% bonus coin chance`:'no bonus coins'},
  {k:'payday', n:'Quest Payday', d:'Quests and checklist items pay more coins.',             fx:l=>l?`+${l*20}% quest coins`:'normal quest coins'},
  {k:'wide',   n:'Wide Eyes',    d:'The camera zooms out so you see more of the map.',       fx:l=>l?`+${l*6}% view`:'normal view'},
  {k:'head',   n:'Head Start',   d:'Start each chapter run already a little bit bigger.',    fx:l=>l?`starts ${(l*0.25).toFixed(2).replace(/0$/, '').replace(/\.0$/, '')} sizes bigger`:'no head start'},
];
const UPF = { speed: l => 1 + 0.1 * l, vacuum: l => 1 + 0.1 * l, magnet: l => 1 + 0.25 * l, coin: l => 1 + 0.12 * l, lucky: l => 0.04 * l, payday: l => 1 + 0.2 * l, wide: l => 1 + 0.06 * l, head: l => 0.25 * l };   // v4: stronger, so every level is felt

/* UI line icons (24x24 strokes). UI never uses emoji. The 10 upgrade icons are 3D models (see UPICON). */
const ICON = {
  coin:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><path d="M12 9v6"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  soundOn:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',
  soundOff:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="m16 9 6 6M22 9l-6 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5M4.6 4.6l2.4 2.4M17 17l2.4 2.4M4.6 19.4 7 17M17 7l2.4-2.4"/>',
  back:'<path d="M15 4l-8 8 8 8"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  play:'<path d="M7 4v16l13-8z"/>',
  board:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  help:'<circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.8 2.6c-.8.3-1.1.9-1.1 1.7v.6M12 17.2v.3"/>',
};
Object.assign(ICON, {
  book: '<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  grad: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
});
const svg = (k, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[k]}</svg>`;

/* Real-world size labels for the "How big am I?" readout (metres). */
const SIZE_WORDS = [
  [0, 'as big as a coin'], [0.06, 'as big as a mouse'], [0.25, 'as big as a cat'], [0.8, 'as big as a dog'],
  [1.6, 'as big as a grown-up'], [4, 'as big as a car'], [12, 'as big as a bus'], [30, 'as big as a whale'],
  [80, 'as big as a jumbo jet'], [250, 'as big as a stadium'], [900, 'as big as a mountain'], [5e3, 'as big as a town'],
  [3e4, 'as big as a city'], [2e5, 'as big as an island'], [1e6, 'as big as a country'], [3e6, 'as big as the Moon'],
  [1.2e7, 'as big as the Earth'], [1.3e8, 'as big as Jupiter'], [1.3e9, 'as big as the Sun'], [1e11, 'as big as a giant star'],
  [1e13, 'as big as a solar system'], [1e16, 'as big as a star cluster'],
];

/* THE METRE TABLE (spec C9) — one real-world scale for the whole game. MT[type] = [fit width, height] in metres:
   fit width = the longest side seen from above (a thing drops in when the hole is at least that wide), height = how
   tall it stands. Chapters 1-4 are measured in metres and take every size from here (a person 1.7 m, a street tree
   6-12 m, a car 4.4 m). Chapter 5-7 sizes come from their growth ladders instead (scale doctrine, clarification 4). */

function inPoly(x, y, p) { // p = flat [x0,y0,x1,y1,...]
  let c = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const yi = p[i + 1], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (p[j] - p[i]) * (y - yi) / (yj - yi) + p[i]) c = !c;

  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;

  const p = [0, 0], X = dx(o.x, G.cam.x), Y = dy(o.y, G.cam.y);
  if (toScreen(X, Y, 0, p) && p[0] > 40 && p[0] < STAGE_W - 40 && p[1] > 40 && p[1] < STAGE_H - 40) return;
  const a = Math.atan2(Y - dy(G.y, G.cam.y), X - dx(G.x, G.cam.x));   // map direction (the camera never turns)

function syncSoundBtn() { $('b-sound-hud').innerHTML = svg(S.settings.sound ? 'soundOn' : 'soundOff'); }

/* ---------- economy actions (UI-independent so tests can call them) ---------- */
function buyUpgrade(ch, i) {
  const st = S.ch[ch], lv = st.up[i];
  if (lv >= 10) return false;
  const c = upCost(ch, lv + 1); if (st.w < c) return false;
  st.w -= c; st.up[i]++; persist(); return true;
}
const bankerArrive = amt => Math.floor(amt * 0.6);
function bankerTransfer(from, to, amt) {
  amt = Math.floor(amt);
  if (from === to || amt <= 0 || !S.ch[from].u || !S.ch[to].u || S.ch[from].w < amt) return false;
  S.ch[from].w -= amt; S.ch[to].w += bankerArrive(amt); persist(); return true;
}
function resetChapter(n) { const u = S.ch[n].u; S.ch[n] = freshCh(n); S.ch[n].u = u || n === 1 ? 1 : 0; if (n === 5) S.passport = {}; persist(); }
function startChapter(n, kind) {
  audioInit(); kind = kind || 'story';
  if (!S.ch[n].u && kind !== 'edu' && kind !== 'explore') return;  // Educational + Exploration: every world is always open
  if (G.mode === 'play') persist();          // keep the chapter we are leaving exactly where it was
  UI.closeModal(); loadChapter(n, kind); UI.show('game'); G.mode = 'play'; persist();
}
/* =====================================================================
   6. MAIN: stage scaling, input, loop, boot
   ===================================================================== */
let SC = 1;
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  SC = Math.min(w / STAGE_W, h / STAGE_H);
  const st = $('stage');
  st.style.transform = `translate(${(w - STAGE_W * SC) / 2}px,${(h - STAGE_H * SC) / 2}px) scale(${SC})`;
  K = Math.min(2.5, SC * (window.devicePixelRatio || 1));
  cv.width = Math.round(STAGE_W * K); cv.height = Math.round(STAGE_H * K);
  V3.prMax = Math.min(GL_MAX_PR, SC * (window.devicePixelRatio || 1)); V3.prK = Math.min(V3.prK || 1, 1);
  if (V3.ok) glRes();
}
function glRes() { V3.ren.setPixelRatio(Math.max(0.3, V3.prMax * V3.prK)); V3.ren.setSize(STAGE_W, STAGE_H, false); }
/* adaptive resolution: a slow device draws the 3D layer at fewer pixels (down to half) instead of dropping frames */
function adaptRes(dt) {
  if (G.mode !== 'play' || G.paused) return;
  const A = V3.ad || (V3.ad = { ema: 16, t: 0 });
  A.ema += (dt * 1000 - A.ema) * 0.08; A.t += dt;
  if (A.t < 0.8) return; A.t = 0;
  if (A.ema > 22 && V3.prK > 0.5) { V3.prK = Math.max(0.5, V3.prK * 0.85); glRes(); }
  else if (A.ema < 14 && V3.prK < 1) { V3.prK = Math.min(1, V3.prK * 1.1); glRes(); }
}
window.addEventListener('resize', fit);
function stagePt(e) { const r = $('stage').getBoundingClientRect(); return [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC]; }
/* floating joystick: a touch anywhere on the play area drops the base under the finger; only the drag vector counts.
   DOM buttons sit above the canvas, so touches that start on them never reach here. */
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (G.mode !== 'play' || G.paused || G.cine || G.joy) return;
  const [x, y] = stagePt(e);
  if (mapTap(x, y)) return;
  G.joy = { id: e.pointerId, x0: x, y0: y, x, y };
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ok */ }
});
cv.addEventListener('pointermove', e => { const j = G.joy; if (j && e.pointerId === j.id) [j.x, j.y] = stagePt(e); });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, e => { if (G.joy && e.pointerId === G.joy.id) G.joy = null; });
document.addEventListener('touchmove', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.mode === 'play' && !G.paused) UI.pause(); persist(); } else if (AU.ctx && G.gestured) AU.ctx.resume(); syncMusic(); });
window.addEventListener('pagehide', persist);

/* loop */
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  G.now = now; G.t += dt; adaptRes(Math.min(0.2, raw));
  if (G.mode === 'play' && !G.paused) update(dt);
  render(); syncMusic();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
