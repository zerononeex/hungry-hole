<!doctype html>
<html lang="en">
<head>

<title>Hungry Hole</title>
<style>
/* ===================== STYLES ===================== */
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Trebuchet MS","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0b0820;color:#fff}
#gl,#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#gl{background:#000}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
.btn{background:linear-gradient(#ffcf4a,#f59e0b);color:#3a1d00;font-weight:800;border-radius:18px;box-shadow:0 6px 0 #a35c00,0 10px 18px rgba(0,0,0,.4);font-size:26px;padding:14px 28px;letter-spacing:1px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35c00}
.btn.blue{background:linear-gradient(#6ad1ff,#2b8fe0);color:#06213b;box-shadow:0 6px 0 #165a96,0 10px 18px rgba(0,0,0,.4)}
.btn.pink{background:linear-gradient(#ff9ad5,#e0459b);color:#3b0626;box-shadow:0 6px 0 #92245f,0 10px 18px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#8ef08e,#2eb84a);color:#06300f;box-shadow:0 6px 0 #18752c,0 10px 18px rgba(0,0,0,.4)}
.btn.grey{background:linear-gradient(#e6e6f0,#a9a9c0);color:#20203a;box-shadow:0 6px 0 #6b6b85,0 10px 18px rgba(0,0,0,.4)}
.btn.red{background:linear-gradient(#ff8f8f,#e03b3b);color:#3b0606;box-shadow:0 6px 0 #922424,0 10px 18px rgba(0,0,0,.4)}
.btn.sm{font-size:18px;padding:9px 16px;border-radius:13px}
.btn[disabled]{filter:grayscale(1) brightness(.7);pointer-events:none}
.ico{width:1em;height:1em;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round{width:64px;height:64px;border-radius:50%;background:rgba(20,16,50,.75);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;padding:0}
.round:active{transform:scale(.92)}
.title{font-size:84px;font-weight:900;letter-spacing:4px;text-align:center;color:#fff;text-shadow:0 6px 0 #5b2bb5,0 10px 30px #000}
.h2{font-size:42px;font-weight:900;text-align:center;margin:18px 0 8px;text-shadow:0 4px 0 #5b2bb5}
.panel{background:rgba(25,18,60,.92);border:3px solid rgba(255,255,255,.25);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.top-back{position:absolute;left:18px;top:18px}
.cards{position:absolute;left:40px;right:40px;top:100px;bottom:20px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:flex-start;overflow-y:auto}
.ccard{width:280px;height:276px;border-radius:20px;padding:12px 14px;box-sizing:border-box;position:relative;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:left}
.ccard.locked{filter:grayscale(.9) brightness(.55)}
.ccard .num{font-size:15px;font-weight:800;opacity:.85;letter-spacing:2px}
.ccard .nm{font-size:25px;font-weight:900;line-height:1.05;margin:2px 0 8px;min-height:52px}
.ccard .row{font-size:16px;margin:3px 0;display:flex;justify-content:space-between}
.ccard .acts{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}
.ccard .acts .btn{flex:1;font-size:17px;padding:8px 6px}
.ccard .lock{position:absolute;right:14px;top:12px;font-size:28px}
.tabs{position:absolute;left:110px;right:20px;top:20px;display:flex;gap:8px;flex-wrap:wrap}
.tab{font-size:17px;font-weight:800;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff}
.tab.sel{background:#ffcf4a;color:#3a1d00}
.tab[disabled]{opacity:.35;pointer-events:none}
.ugrid{position:absolute;left:24px;top:96px;width:770px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ucard{height:200px;border-radius:18px;background:rgba(40,30,90,.95);border:3px solid rgba(255,255,255,.18);color:#fff;padding:10px 6px;box-sizing:border-box;text-align:center;position:relative}
.ucard.sel{border-color:#ffcf4a;box-shadow:0 0 0 3px #ffcf4a55}
.ucard svg.uic{width:64px;height:64px;display:block;margin:2px auto 6px}
.ucard .un{font-size:16px;font-weight:800;min-height:38px;line-height:1.15}
.pips{display:flex;gap:3px;justify-content:center;margin:6px 0}
.pip{width:10px;height:14px;border-radius:3px;background:rgba(255,255,255,.18)}
.pip.on{background:#ffcf4a}
.ucard .cost{font-size:15px;font-weight:800;color:#ffd96a}
.udetail{position:absolute;left:812px;top:96px;width:444px;height:420px;padding:20px;box-sizing:border-box}
.udetail h3{margin:0 0 6px;font-size:30px}
.udetail p{font-size:18px;line-height:1.35;margin:6px 0}
.wallet{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:24px;color:#ffd96a}
.holdpop{position:absolute;z-index:30;width:300px;padding:16px;font-size:19px;line-height:1.35;pointer-events:none;display:none;background:#fff8dc;color:#2a1a00;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.6);border:3px solid #ffcf4a}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
.modal.on{display:flex}
.mbox{padding:24px 28px;min-width:420px;max-width:900px;text-align:center}
.mbox .btn{margin:8px}
.set-grid{position:absolute;left:40px;right:40px;top:96px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-col{padding:18px 20px;box-sizing:border-box;overflow-y:auto}
.set-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px;font-size:21px;font-weight:700;gap:10px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.seg button{font-size:17px;font-weight:800;padding:8px 13px;background:transparent;color:#fff}
.seg button.sel{background:#ffcf4a;color:#3a1d00}
textarea{width:100%;box-sizing:border-box;height:84px;font-size:13px;border-radius:10px;border:2px solid #777;background:#110d2b;color:#cfe;padding:6px;font-family:monospace;user-select:text;-webkit-user-select:text}
.qboard{position:absolute;left:30px;right:30px;top:96px;bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto;align-content:start}
.qitem{border-radius:12px;padding:8px 10px;font-size:15px;line-height:1.2;background:rgba(255,255,255,.08);display:flex;gap:8px;align-items:center;min-height:44px}
.qitem.done{background:rgba(70,200,110,.28)}
.qitem .tk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
.qitem.done .tk{background:#2eb84a;border-color:#2eb84a}
#hudbtns{position:absolute;right:16px;bottom:16px;display:none;gap:12px;z-index:5}
#hudbtns.on{display:flex}
.report{font-size:20px;line-height:1.7}
.bar{height:16px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:#6ad1ff}
.credits{position:absolute;inset:0;overflow:hidden;text-align:center}
.credits .roll{position:absolute;left:0;right:0;top:720px;font-size:30px;line-height:1.7}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes flycoin{0%{transform:translate(0,0);opacity:1}100%{transform:translate(260px,-10px);opacity:0}}
.banker{animation:bob 1.2s ease-in-out infinite;transform-origin:50% 90%}
.flycoin{animation:flycoin .8s ease-in forwards}
</style>

<body>
<div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="cv" width="1280" height="720"></canvas>

  <!-- MAIN SCREEN -->
  <div class="scr" id="s-main">
    <div class="title" style="position:absolute;left:0;right:0;top:26px">HUNGRY HOLE</div>
    <div style="position:absolute;left:0;right:0;top:150px;text-align:center"><button class="btn" id="b-start" style="font-size:44px;padding:18px 90px">START</button></div>
    <div style="position:absolute;left:0;right:0;top:590px;display:flex;justify-content:center;gap:26px">
      <button class="btn blue" id="b-chapters">CHAPTERS</button>
      <button class="btn pink" id="b-upgrades">UPGRADES</button>
      <button class="btn green" id="b-settings">SETTINGS</button>
    </div>
    <div style="position:absolute;left:0;right:0;top:252px;text-align:center;font-size:20px;opacity:.85" id="main-sub"></div>
    <button class="round" id="b-gear" style="position:absolute;right:18px;bottom:18px" aria-label="Settings"></button>
  </div>

  <!-- CHAPTERS -->
  <div class="scr" id="s-chapters">
    <button class="round top-back" data-back aria-label="Back"></button>
    <div class="h2">CHAPTERS</div>
    <div class="cards" id="chap-cards"></div>
  </div>

  <!-- QUEST BOARD -->
  <div class="scr" id="s-board">
    <button class="round top-back" id="board-back" aria-label="Back"></button>
    <div class="h2" id="board-title">QUEST BOARD</div>
    <div class="qboard" id="board-list"></div>
  </div>

  <!-- UPGRADES -->
  <div class="scr" id="s-upgrades">
    <button class="round top-back" data-back aria-label="Back"></button>
    <div class="tabs" id="up-tabs"></div>
    <div class="ugrid" id="up-grid"></div>
    <div class="udetail panel" id="up-detail"></div>
    <div style="position:absolute;left:812px;top:530px;width:444px;display:flex;align-items:center;justify-content:space-between">
      <span class="wallet" id="up-wallet"></span>
      <button class="btn" id="b-banker">BANKER</button>
    </div>
    <div style="position:absolute;left:24px;top:540px;width:770px;font-size:17px;opacity:.8;line-height:1.4">Tap a card to pick it. Press and hold a card to read about it. Upgrades only help the chapter they were bought in.</div>
    <div class="holdpop" id="holdpop"></div>
  </div>

  <!-- SETTINGS -->
  <div class="scr" id="s-settings">
    <button class="round top-back" data-back aria-label="Back"></button>
    <div class="h2">SETTINGS</div>
    <div class="set-grid">
      <div class="set-col panel" id="set-left"></div>
      <div class="set-col panel" id="set-right"></div>
    </div>
  </div>

  <!-- CREDITS -->
  <div class="scr" id="s-credits"><div class="credits"><div class="roll" id="credits-roll"></div></div></div>

  <div id="hudbtns">
    <button class="round" id="b-sound-hud" aria-label="Sound"></button>
    <button class="round" id="b-pause" aria-label="Pause"></button>
  </div>

  <div class="modal" id="modal"><div class="mbox panel" id="mbox"></div></div>
</div>
<script src="three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   HUNGRY HOLE — single-file game. Sections, in order:
     1. DATA: common tables (tiers, upgrades, icons)
     2. DATA: the 7 chapters (types, zones, authored places, checklists,
        40 Tiny Quests each)
     3. ENGINE: save, audio/speech, world (grid + procedural layers),
        hole, eating, quests, economy
     4. RENDER: backgrounds, objects, hole, HUD
     5. UI: menu screens (DOM), modals
     6. MAIN: input, loop, boot, test hook (window.HH)
   ===================================================================== */

/* ===================== 1. DATA: COMMON ===================== */
const SAVE_KEY = 'hungry-hole-data-v1';      // never rename; fields are additive only
const STAGE_W = 1280, STAGE_H = 720;
const FIT_K = 1.3;                            // fit-width = 1.3 x tier diameter, the same factor as the hole's own size
const FALL_MS = 340;                          // tip over the rim, sink, spin + shrink; then the eat pipeline runs
const WOBBLE_MIN = 0.85, WOBBLE_STEP = 0.36;  // owner's wobble rule: from 85% of the needed size, bumps can tip a leaning thing in
const NEED_K = 0.2, XP_K = 1.8, SPEED = 4.32, START_P = 0.3;   // v3 pace: growth need x0.35, +50% XP per eat, speed +20%, pre-grown start
const PTS = [0, 5, 8, 12, 16, 22, 30, 40, 52, 66, 82]; // points by tier (x chapter cost scale)
const MULT = [1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0]; // growth/points ladder (x2.0 only at lvl 10)
const COMBO_MS = 6000;
const UP_BASE = 30, UP_GROW = 1.4;            // upgrade cost = base * grow^(n-1) * chapter multiplier
const RESPAWN_MS = 45000;                     // eaten ordinary things come back after this, out of sight
const TINY_BONUS = 20, CHECK_BONUS = 100;     // quest coin bonuses (x chapter coin scale)

const UPGRADES = [
  {k:'speed',  n:'Speed',        d:'Your hole zooms around faster.',                         fx:l=>l?`+${l*3}% speed`:'normal speed'},
  {k:'growth', n:'Growth Boost', d:'Every bite makes you grow more.',                        fx:l=>`x${MULT[l].toFixed(1)} growth`},
  {k:'points', n:'Points Boost', d:'Every bite is worth more points.',                       fx:l=>`x${MULT[l].toFixed(1)} points`},
  {k:'coin',   n:'Coin Boost',   d:'You earn more coins from everything.',                   fx:l=>l?`+${l*6}% coins`:'normal coins'},
  {k:'magnet', n:'Magnet Aura',  d:'Things you can eat slide toward you by themselves.',     fx:l=>l?`pulls from ${100+l*12}% of your size`:'no pull yet'},
  {k:'vacuum', n:'Vacuum Reach', d:'Things fall in a little bit earlier.',                   fx:l=>l?`+${l*3}% reach`:'normal reach'},
  {k:'lucky',  n:'Lucky Coins',  d:'Sometimes a bite drops a bonus coin too.',               fx:l=>l?`${l*2}% bonus coin chance`:'no bonus coins'},
  {k:'payday', n:'Quest Payday', d:'Quests and checklist items pay more coins.',             fx:l=>l?`+${l*10}% quest coins`:'normal quest coins'},
  {k:'wide',   n:'Wide Eyes',    d:'The camera zooms out so you see more of the map.',       fx:l=>l?`+${(l*2.5).toFixed(1)}% view`:'normal view'},
  {k:'head',   n:'Head Start',   d:'Start each chapter run already a little bit bigger.',    fx:l=>l?`${l*2}% of size 1 pre-grown`:'no head start'},
];

/* Vector icons (24x24 strokes). UI never uses emoji. */
const ICON = {
  speed:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  growth:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M9.5 4.5 12 2l2.5 2.5M9.5 19.5 12 22l2.5-2.5M4.5 9.5 2 12l2.5 2.5M19.5 9.5 22 12l-2.5 2.5"/>',
  points:'<path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.6 6 21l1.3-6.8-5-4.7 6.8-.8z"/>',
  coin:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><path d="M12 9v6"/>',
  magnet:'<path d="M5 3h4v8a3 3 0 0 0 6 0V3h4v8a7 7 0 0 1-14 0z"/><path d="M5 7h4M15 7h4"/>',
  vacuum:'<path d="M3 4h18l-7 8v6l-4 3v-9z"/>',
  lucky:'<circle cx="8.5" cy="8.5" r="3.5"/><circle cx="15.5" cy="8.5" r="3.5"/><circle cx="8.5" cy="15.5" r="3.5"/><circle cx="15.5" cy="15.5" r="3.5"/><path d="M15.5 15.5 21 22"/>',
  payday:'<path d="M8 3h8v3H8z"/><path d="M8 4.5H5V21h14V4.5h-3"/><path d="m8.5 13 2.5 2.5 4.5-5"/>',
  wide:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  head:'<path d="M5 22V3"/><path d="M5 4h12l-2.5 4L17 12H5"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  soundOn:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',
  soundOff:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="m16 9 6 6M22 9l-6 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5M4.6 4.6l2.4 2.4M17 17l2.4 2.4M4.6 19.4 7 17M17 7l2.4-2.4"/>',
  back:'<path d="M15 4l-8 8 8 8"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  play:'<path d="M7 4v16l13-8z"/>',
  board:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
};
const svg = (k, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[k]}</svg>`;

/* Real-world size labels for the "How big am I?" readout (metres). */
const SIZE_WORDS = [
  [0, 'as big as a coin'], [0.06, 'as big as a mouse'], [0.25, 'as big as a cat'], [0.8, 'as big as a dog'],
  [1.6, 'as big as a grown-up'], [4, 'as big as a car'], [12, 'as big as a bus'], [30, 'as big as a whale'],
  [80, 'as big as a jumbo jet'], [250, 'as big as a stadium'], [900, 'as big as a mountain'], [5e3, 'as big as a town'],
  [3e4, 'as big as a city'], [2e5, 'as big as an island'], [1e6, 'as big as a country'], [3e6, 'as big as the Moon'],
  [1.2e7, 'as big as the Earth'], [1.3e8, 'as big as Jupiter'], [1.3e9, 'as big as the Sun'], [1e11, 'as big as a giant star'],
  [1e13, 'as big as a solar system'], [1e16, 'as big as a star cluster'],
];

/* ===================== small utils ===================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash4(a, b, c, d) { let h = 2166136261; for (const v of [a, b, c, d]) { h = Math.imul(h ^ (v | 0), 16777619); h ^= h >>> 13; } return h >>> 0; }
function inPoly(x, y, p) { // p = flat [x0,y0,x1,y1,...]
  let c = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const yi = p[i + 1], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (p[j] - p[i]) * (y - yi) / (yj - yi) + p[i]) c = !c;
  }
  return c;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function lineDist(px, py, p) { let m = 1e18; for (let i = 0; i < p.length - 2; i += 2) m = Math.min(m, segDist(px, py, p[i], p[i + 1], p[i + 2], p[i + 3])); return m; }
const fmt = n => Math.floor(n).toLocaleString('en-US');
function fmtSize(m) {
  if (m < 1) return (m * 100).toFixed(m < 0.1 ? 1 : 0) + ' cm';
  if (m < 1000) return m.toFixed(m < 10 ? 1 : 0) + ' m';
  const km = m / 1000;
  if (km >= 1e9) return (km / 1e9).toFixed(km < 1e10 ? 1 : 0) + ' billion km';
  if (km >= 1e6) return (km / 1e6).toFixed(km < 1e7 ? 1 : 0) + ' million km';
  return (km < 10 ? km.toFixed(1) : fmt(km)) + ' km';
}
function sizeWord(m) { let w = SIZE_WORDS[0][1]; for (const [v, s] of SIZE_WORDS) if (m >= v) w = s; return w; }
/* weighted list 'a:3,b,c:2' -> [[a,3],[b,1],[c,2]] */
function wlist(s) { return s.split(',').map(x => { const [k, w] = x.trim().split(':'); return [k, w ? +w : 1]; }); }
function wpick(list, r) { let tot = 0; for (const e of list) tot += e[1]; let v = r * tot; for (const e of list) { v -= e[1]; if (v < 0) return e[0]; } return list[list.length - 1][0]; }

/* =====================================================================
   2. DATA: THE 7 CHAPTERS
   Each chapter: sizes (tier diameters, world units), real (metres per tier,
   for "How big am I?"), types {id:[emoji,name,tier,opts]}, zones (procedural
   filler by tier), zoneAt(), build() (authored places), check (3-item
   checklist), quests (40 Tiny Quests), bg() (code-drawn background).
   Quest strings: c:what:n collect · a:what:n avoid · t:n total · s:n score ·

function update(dt) {
  const C = G.C, D = holeD(), r = D / 2;
  if (G.cine) { if (C.cineUpdate) C.cineUpdate(dt); return; }
  // movement: follow the finger, slidey
  const sp = D * (C.spd || SPEED) * (1 + 0.03 * UPL('speed'));

  if (G.ptr) {
    const [wx, wy] = ptrWorld(), ddx = wx - G.x, ddy = wy - G.y, d = Math.hypot(ddx, ddy);

  }
  const k = Math.min(1, dt * 4.5);

  G.x += G.vx * dt; G.y += G.vy * dt;
  if (C.wrap) { G.x = (G.x % C.W + C.W) % C.W; G.y = (G.y % C.H + C.H) % C.H; }

  const tz = targetZoom();
  G.cam.z += (tz - G.cam.z) * Math.min(1, dt * 2.5);
  G.cam.x += dx(G.x, G.cam.x) * Math.min(1, dt * 6); G.cam.y += dy(G.y, G.cam.y) * Math.min(1, dt * 6);
  if (C.wrap) { G.cam.x = (G.cam.x % C.W + C.W) % C.W; G.cam.y = (G.cam.y % C.H + C.H) % C.H; }

  const z = G.cam.z, vr = viewRect(z), mg = D + (vr[2] - vr[0]) * 0.06;
  G.vr = vr;
  G.vis = gather(G.cam.x + vr[0] - mg, G.cam.y + vr[1] - mg, G.cam.x + vr[2] + mg, G.cam.y + vr[3] + mg + (vr[3] - vr[1]) * 0.35, z);

function moveOnPath(o, T) {

function compassTargets() {
  const C = G.C, st = G.st, out = [];
  const nearest = (fn) => { let b = null, bd = 1e30; for (const o of G.auth) { if (o.dead || !fn(o)) continue; const d = Math.hypot(dx(o.x, G.x), dy(o.y, G.y)); if (d < bd) { bd = d; b = o; } } return b; };
  let best = null;
  C.CK.forEach((q, j) => {
    if (best || qDone(q, st.check[j])) return;
    if (q.k === 'q') {
      if (q.ids) best = nearest(o => o.id === q.items[st.check[j]]);
      else best = G.tiles.find(t => t.owner.ck === j && t.on && !t.dead);
    } else if (q.k === 'c' || q.k === 'b') {
      best = nearest(o => (o.keep || o.hint) && matches(o, q.what));
      if (!best && C.hint) { const h = C.hint(q.what); if (h) best = { x: h[0], y: h[1] }; }
    }
  });
  if (!best && st.c && C.exitAt) best = C.exitAt();
  if (best) out.push({ o: best, col: '#ffcf4a' });
  let tl = G.tiles.find(t => t.on && !t.dead && t.owner.ck === undefined);
  // tiny quests that need a trip: point at the place or the one landmark
  for (const a of st.act) {
    if (tl) break;
    const q = C.Q[a.i];
    if (q.rg && C.regionPos && C.regionAt(G.x, G.y) !== q.rg) { const p = C.regionPos(q.rg); if (p) tl = { x: p[0], y: p[1] }; }
    else if (q.k === 'b') tl = nearest(o => matches(o, q.what));
  }
  if (tl) out.push({ o: tl, col: '#6ad1ff' });
  return out;
}

  },
  /* ----- upgrades + banker ----- */
  upCh: 1, upSel: 0,
  upgrades(n) {

    $('up-tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => UI.upgrades(+b.dataset.tab));
    $('up-grid').innerHTML = UPGRADES.map((u, i) => {

        <div class="un">${u.n}</div><div class="pips">${Array.from({ length: 10 }, (_, j) => `<i class="pip${j < lv ? ' on' : ''}"></i>`).join('')}</div>

          held = true; const lv = st.up[i];

  upDetail() {

  banker() {
    const unl = [1, 2, 3, 4, 5, 6, 7].filter(n => S.ch[n].u);

  /* ----- settings ----- */

        `<div style="display:flex;align-items:center;gap:10px"><span style="width:120px">${n}</span><div class="bar" style="flex:1"><i style="width:${100 * v / tot}%"></i></div><b style="width:50px;text-align:right">${v}</b></div>`).join('')}
        <div style="font-size:17px;opacity:.85;margin-top:6px">Tiny Quests finished: ${tq}/280 · Passport stamps: ${Object.keys(S.passport).length}</div></div>`;
    $('set-right').innerHTML = `
      <div style="font-size:22px;font-weight:900;margin-bottom:6px">SAVE BACKUP</div>

      <input type="file" id="f-import" accept=".txt,.json,application/json,text/plain" style="display:none">

      <textarea id="t-code" spellcheck="false"></textarea>

      <button class="btn sm red" id="b-rch"></button> <button class="btn sm red" id="b-rall"></button>`;
    document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
      const k = b.dataset.set; let v = b.dataset.v; if (k !== 'learn') v = +v;
      S.settings[k] = v; persist(); UI.settings(UI.setBack); syncSoundBtn();
    });
    document.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { UI.rsCh = +b.dataset.rs; UI.settings(UI.setBack); });
    $('b-export').onclick = () => {
      const code = exportCode(); $('t-code').value = code;
      try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' })); a.download = 'hungry-hole-save.txt'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { /* code shown anyway */ }
    };
    $('b-file').onclick = () => $('f-import').click();
    $('f-import').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => UI.tryImport(String(r.result)); r.readAsText(f); };
    $('b-import').onclick = () => UI.tryImport($('t-code').value);
    twoTap($('b-rch'), 'RESET CHAPTER ' + (UI.rsCh || 1), () => { resetChapter(UI.rsCh || 1); UI.settings(UI.setBack); });
    twoTap($('b-rall'), 'RESET EVERYTHING', () => { S = freshSave(); persist(); UI.settings(UI.setBack); });
    UI.show('settings');
  },
  tryImport(text) {
    const d = parseImport(text);
    if (!d) { UI.modal(`<div class="h2">That code didn't work</div><p style="font-size:20px">Check you copied the whole save code and try again. Your current save is safe.</p><button class="btn" id="m-ok">OK</button>`); $('m-ok').onclick = UI.closeModal; return; }
    const tq = [1, 2, 3, 4, 5, 6, 7].reduce((a, n) => a + d.ch[n].board.filter(Boolean).length, 0), cc = [1, 2, 3, 4, 5, 6, 7].filter(n => d.ch[n].c).length;
    UI.modal(`<div class="h2">Replace your save?</div><p style="font-size:20px">The imported save has ${cc} chapter${cc === 1 ? '' : 's'} complete and ${tq} Tiny Quests done.<br>This will overwrite the save on this device.</p>
      <button class="btn green" id="m-yes">YES, IMPORT</button><button class="btn grey" id="m-no">CANCEL</button>`);
    $('m-yes').onclick = () => { S = d; persist(); UI.closeModal(); UI.settings(UI.setBack); };
    $('m-no').onclick = UI.closeModal;
  },
  /* ----- modals ----- */
  modal(html) { $('mbox').innerHTML = html; $('modal').classList.add('on'); },
  closeModal() { $('modal').classList.remove('on'); },
  pause() {
    if (G.mode !== 'play' || G.trans) return;
    G.paused = true; G.ptr = null; persist();
    UI.modal(`<div class="h2">PAUSED</div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <button class="btn green" id="p-res" style="width:380px">RESUME</button>
      <button class="btn blue" id="p-board" style="width:380px">QUEST BOARD</button>
      <button class="btn" id="p-restart" style="width:380px">RESTART CHAPTER RUN</button>
      <button class="btn pink" id="p-menu" style="width:380px">SAVE &amp; MAIN MENU</button>
      <button class="btn grey" id="p-snd" style="width:380px">SOUND: ${S.settings.sound ? 'ON' : 'OFF'}</button></div>
      <div style="font-size:15px;opacity:.8;margin-top:8px">Restart puts you back at the chapter start, small again. Coins, upgrades and quest boards are kept.</div>`);
    $('p-res').onclick = UI.resume;
    $('p-board').onclick = () => { UI.closeModal(); UI.board(G.C.n, 'pause'); G.mode = 'play'; };
    twoTap($('p-restart'), 'RESTART CHAPTER RUN', () => { UI.closeModal(); restartRun(); UI.show('game'); G.paused = false; });
    $('p-menu').onclick = () => { persist(); UI.closeModal(); G.paused = false; G.mode = 'menu'; UI.main(); };
    $('p-snd').onclick = () => { S.settings.sound = S.settings.sound ? 0 : 1; persist(); syncSoundBtn(); $('p-snd').textContent = 'SOUND: ' + (S.settings.sound ? 'ON' : 'OFF'); };

  resume() { UI.closeModal(); UI.show('game'); G.mode = 'play'; G.paused = false; },

      ${n < 7 ? `<p style="font-size:19px">Chapter ${n + 1}: <b>${esc(CH[n + 1].name)}</b> is unlocked.</p><button class="btn green" id="c-next">NEXT CHAPTER</button>` : ''}
      <button class="btn blue" id="c-stay">KEEP EXPLORING</button><button class="btn grey" id="c-menu">MAIN MENU</button>`);
    if ($('c-next')) $('c-next').onclick = () => { UI.closeModal(); G.paused = false; zoomTo(n + 1); };

function syncSoundBtn() { $('b-sound-hud').innerHTML = svg(S.settings.sound ? 'soundOn' : 'soundOff'); }

/* ---------- economy actions (UI-independent so tests can call them) ---------- */
function buyUpgrade(ch, i) {
  const st = S.ch[ch], lv = st.up[i];
  if (lv >= 10) return false;
  const c = upCost(ch, lv + 1); if (st.w < c) return false;
  st.w -= c; st.up[i]++; persist(); return true;
}
const bankerArrive = amt => Math.floor(amt * 0.6);
function bankerTransfer(from, to, amt) {
  amt = Math.floor(amt);
  if (from === to || amt <= 0 || !S.ch[from].u || !S.ch[to].u || S.ch[from].w < amt) return false;
  S.ch[from].w -= amt; S.ch[to].w += bankerArrive(amt); persist(); return true;
}
function resetChapter(n) { const u = S.ch[n].u; S.ch[n] = freshCh(n); S.ch[n].u = u || n === 1 ? 1 : 0; if (n === 5) S.passport = {}; persist(); }
function startChapter(n) {
  audioInit();
  if (!S.ch[n].u) return;
  if (G.mode === 'play') persist();         // keep the chapter we are leaving exactly where it was
  UI.closeModal(); loadChapter(n); UI.show('game'); G.mode = 'play'; persist();
}
function zoomTo(n) {
  render();                                   // fresh frame so the WebGL buffer can be copied
  const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height;
  const sx = snap.getContext('2d'); sx.drawImage(glc, 0, 0, snap.width, snap.height); sx.drawImage(cv, 0, 0);
  persist();
  G.trans = { t0: G.now, snap, label: 'Chapter ' + n + ': ' + CH[n].name };
  G.mode = 'menu'; $('hudbtns').classList.remove('on');
  setTimeout(() => { G.trans = null; startChapter(n); G.cam.z *= 0.12; }, 1900);
}

/* =====================================================================
   6. MAIN: stage scaling, input, loop, boot
   ===================================================================== */
let SC = 1;
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  SC = Math.min(w / STAGE_W, h / STAGE_H);
  const st = $('stage');
  st.style.transform = `translate(${(w - STAGE_W * SC) / 2}px,${(h - STAGE_H * SC) / 2}px) scale(${SC})`;
  K = Math.min(2.5, SC * (window.devicePixelRatio || 1));
  cv.width = Math.round(STAGE_W * K); cv.height = Math.round(STAGE_H * K);
  if (V3.ok) { V3.ren.setPixelRatio(Math.min(GL_MAX_PR, SC * (window.devicePixelRatio || 1))); V3.ren.setSize(STAGE_W, STAGE_H, false); }
}
window.addEventListener('resize', fit);
function stagePt(e) { const r = $('stage').getBoundingClientRect(); return [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC]; }
cv.addEventListener('pointerdown', e => { audioInit(); if (G.mode === 'play' && !G.paused && !G.cine) { G.ptr = stagePt(e); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ok */ } } });
cv.addEventListener('pointermove', e => { if (G.ptr) G.ptr = stagePt(e); });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, () => { G.ptr = null; });
document.addEventListener('touchmove', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.mode === 'play' && !G.paused) UI.pause(); persist(); } });
window.addEventListener('pagehide', persist);

/* buttons */
$('b-start').onclick = () => { audioInit(); startChapter(S.ch[S.last] && S.ch[S.last].u ? S.last : 1); };
$('b-chapters').onclick = () => { audioInit(); UI.chapters(); };
$('b-upgrades').onclick = () => { audioInit(); UI.upgrades(S.last); };
$('b-settings').onclick = () => { audioInit(); UI.settings('main'); };
$('b-gear').onclick = () => { audioInit(); UI.settings('main'); };
$('b-gear').innerHTML = svg('gear');
$('b-pause').innerHTML = svg('pause');
$('b-pause').onclick = () => UI.pause();
$('b-sound-hud').onclick = () => { S.settings.sound = S.settings.sound ? 0 : 1; syncSoundBtn(); persist(); };
document.querySelectorAll('[data-back]').forEach(b => { b.innerHTML = svg('back'); b.onclick = () => UI.main(); });
$('board-back').innerHTML = svg('back');
document.querySelector('#s-settings [data-back]').onclick = () => UI.main();

/* loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.now = now; G.t += dt;
  if (G.mode === 'play' && !G.paused && !G.trans) update(dt);
  render();
  requestAnimationFrame(frame);
}
initGL(); fit(); syncSoundBtn(); UI.main();
requestAnimationFrame(frame);

/* test hook for automated checks (harmless in play) */
window.HH = { get S() { return S; }, G, CH, UI, prep, loadChapter, startChapter, eat, holeD, need, addXP, bankerTransfer, bankerArrive, buyUpgrade, upCost,
  exportCode, parseImport, persist, normalize, matches, gather, restartRun, questEvent, rollQuests, update, canEat, UPL, compassTargets, setS(d) { S = d; }, qDone, V3, MODEL, fits, capture, bump, hidesHole };
